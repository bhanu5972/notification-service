# Application
spring.application.name=notification-service
server.port=8086

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/notification_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging - Mask sensitive data (email, phone)
logging.pattern.console={"timestamp":"%d{ISO8601}","level":"%p","service":"notification-service","traceId":"%X{traceId}","message":"%m"}%n
logging.level.com.example.notification=DEBUG

# Email configuration (for simulation)
notification.email.enabled=true
notification.sms.enabled=true

# Mask sensitive data in logs
notification.mask.email=true
notification.mask.phone=true